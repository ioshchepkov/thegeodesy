baseURL: https://thegeodesy.com/
title: The Geodesy
copyright: "© 2026 Ilya Oshchepkov, [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
theme: ["PaperMod"]

enableRobotsTXT: true
sitemap:
  changefreq: weekly
  priority: 0.5
canonifyURLs: false

caches:
  images:
    dir: :cacheDir/images

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - '\['
            - '\]'
          - - $$
            - $$
          inline:
          - - '\('
            - '\)'
          - - $
            - $
        enable: true
  highlight:
    noClasses: false
    lineNos: true

params:
  env: production
  enableEmoji: true
  defaultTheme: auto
  displayFullLangName: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  showToc: true
  ShowPostNavLinks: true
  ShowShareButtons: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: false
  hideMeta: false
  math: true
  assets:
    disableHLJS: true
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ['title', 'permalink', 'summary', 'content']

defaultContentLanguage: "ru"
defaultContentLanguageInSubdir: true
disableDefaultLanguageRedirect: false
languages:
  ru:
    languageName: "Русский"
    languageCode: "ru"
    weight: 1
    contentDir: "content/ru"
    menu:
      main:
        - identifier: knowledge
          name: Знания
          url: ru/knowledge/
          weight: 10
        - identifier: blog
          name: Блог
          url: ru/blog/
          weight: 20
        - identifier: courses
          name: Курсы
          url: ru/courses/
          weight: 30
        - identifier: search
          name: "Поиск"
          url: "ru/search/"
          weight: 40
        - identifier: about
          name: "О сайте"
          url: "ru/about/"
          weight: 50
    params:
#      author: "Илья Ощепков"
      profileMode:
        enabled: true
        title: "The Geodesy"
        subtitle: "🧠 Теория — 💻 Вычисления —  📍 Практика"
        buttons:
          - name: Знания
            url: "/ru/knowledge/"
          - name: "Блог"
            url: "/ru/blog/"
          - name: "Курсы"
            url: "/ru/courses/"
      socialIcons:
        - name: "GitHub"
          url: "https://github.com/ioshchepkov/thegeodesy"
        - name: "Email"
          url: "mailto:contact@thegeodesy.com"
        - name: "Telegram"
          url: "https://t.me/thegeodesy"
        - name: "RSS"
          url: "index.xml"
  en:
    languageName: "English"
    languageCode: "en"
    weight: 2
    contentDir: "content/en"
    menu:
      main:
        - identifier: knowledge
          name: Knowledge
          url: en/knowledge/
          weight: 10
        - identifier: blog
          name: Blog
          url: /en/blog/
          weight: 20
        - identifier: courses
          name: Courses
          url: en/courses/
          weight: 30
        - identifier: search
          name: "Search"
          url: "en/search/"
          weight: 40
        - identifier: about
          name: "About"
          url: "en/about/"
          weight: 50
    params:
#      author: "Ilya Oshchepkov"
      profileMode:
        enabled: true
        title: "The Geodesy"
        subtitle: "🧠 Theory — 💻 Computation — 📍 Practice" #or 🛰
        buttons:
          - name: Knowledge
            url: "/en/knowledge/"
          - name: "Blog"
            url: "/en/blog/"
          - name: Courses
            url: "/en/courses/"
      socialIcons:
        - name: "GitHub"
          url: "https://github.com/ioshchepkov/thegeodesy"
        - name: "Email"
          url: "mailto:contact@thegeodesy.com"
        - name: "RSS"
          url: "index.xml"
