baseURL: https://thegeodesy.com/
title: The Geodesy
copyright: "© 2026 Ilya Oshchepkov, [CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/)"
theme: ["PaperMod"]

taxonomies:
  series: series
  tag: tags

enableRobotsTXT: true
sitemap:
  changefreq: weekly
  priority: 0.5
canonifyURLs: false

caches:
  images:
    dir: :cacheDir/images

outputs:
  home:
    - HTML
    - RSS
    - JSON

  section:
    - HTML
    - RSS

  taxonomy:
    - HTML

  term:
    - HTML

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - - '\['
              - '\]'
            - - $$
              - $$
          inline:
            - - '\('
              - '\)'
            - - $
              - $
        enable: true
  highlight:
    noClasses: false
    lineNos: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

params:
  env: production
  enableEmoji: true
  defaultTheme: auto
  displayFullLangName: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  showToc: true
  tocopen: false
  UseHugoToc: true
  ShowPostNavLinks: true
  ShowShareButtons: false
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  hideMeta: false
  math: true
  assets:
    disableHLJS: true
    favicon: /favicon.svg
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

defaultContentLanguage: "ru"
defaultContentLanguageInSubdir: true
disableDefaultLanguageRedirect: false
languages:
  ru:
    label: "Русский"
    locale: "ru"
    weight: 1
    menu:
      main:
        - identifier: blog
          name: Блог
          url: ru/blog/
          weight: 20
        - identifier: about
          name: "О сайте"
          url: "ru/about/"
          weight: 50
        - identifier: search
          name: "Поиск"
          url: "ru/search/"
          weight: 60
    params:
      #      author: "Илья Ощепков"
      profileMode:
        enabled: true
        imageUrl: /images/logo.svg
        imageTitle: "Логотип The Geodesy"
        imageWidth: 240
        imageHeight: 240
        title: "The Geodesy"
        subtitle: "🧠 Теория — 💻 Вычисления —  📍 Практика"
      socialIcons:
        - name: "GitHub"
          url: "https://github.com/thegeodesy"
        - name: "Email"
          url: "mailto:contact@thegeodesy.com"
        - name: "Telegram"
          url: "https://t.me/thegeodesy"
        - name: "RSS"
          url: "index.xml"
  en:
    label: "English"
    locale: "en"
    weight: 2
    menu:
      main:
        - identifier: blog
          name: Blog
          url: /en/blog/
          weight: 20
        - identifier: about
          name: "About"
          url: "en/about/"
          weight: 50
        - identifier: search
          name: "Search"
          url: "en/search/"
          weight: 60
    params:
      #      author: "Ilya Oshchepkov"
      profileMode:
        enabled: true
        imageUrl: /images/logo.svg
        imageTitle: "The Geodesy logo"
        imageWidth: 240
        imageHeight: 240
        title: "The Geodesy"
        subtitle: "🧠 Theory — 💻 Computation — 📍 Practice" #or 🛰
      socialIcons:
        - name: "GitHub"
          url: "https://github.com/thegeodesy"
        - name: "Email"
          url: "mailto:contact@thegeodesy.com"
        - name: "RSS"
          url: "index.xml"
